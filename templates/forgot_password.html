
<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack - Forgot Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f8f9;
            color: #173b4d;
        }


        .header {
            background: #006f7c;
            color: white;
            padding: 15px 40px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 8px;
            object-fit: contain;
            margin-right: 15px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 16px;
        }


        .container {
            width: 100%;
            max-width: 550px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .forgot-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 30px;
            color: #173b4d;
        }

        .subtitle {
            text-align: center;
            color: #6b7c85;
            margin-bottom: 25px;
            line-height: 1.5;
        }


        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .required {
            color: red;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #007b8a;
            box-shadow: 0 0 0 2px rgba(0, 123, 138, 0.10);
        }


        .captcha-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        canvas {
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            background: #f0f6f8;
            max-width: 100%;
        }

        .refresh-btn {
            background: #f0f6f8;
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            width: 48px;
            height: 48px;
            cursor: pointer;
            color: #006f7c;
            font-size: 18px;
        }

        .error-message {
            background: #ffe7e7;
            color: #c62828;
            border: 1px solid #f2b5b5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }


        .success-message {
            background: #e7f7ed;
            color: #18733a;
            border: 1px solid #b7e4c7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }


        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #006f7c;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background: #005864;
        }


        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .back-link a {
            color: #006f7c;
            font-weight: bold;
            text-decoration: none;
        }
        .password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 45px;
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #006f7c;
    cursor: pointer;
    font-size: 18px;
    padding: 5px;
}


        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .forgot-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>


    <header class="header">
        <img
            src="{{ url_for('static', filename='images/meditrack_logo.png') }}"
            alt="MediTrack Logo"
            class="logo"
        >

        <div class="brand">
            <h1>MediTrack</h1>
            <p>Track Medicines. Improve Care.</p>
        </div>
    </header>


    <div class="container">
        <div class="forgot-box">

            <h2>Reset Password</h2>

            <p class="subtitle">
                Enter your registered email and verify your account
                to change your password.
            </p>

            {% if error %}
                <div class="error-message" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="success-message" role="status">
                    {{ success }}
                </div>
            {% endif %}

            <div
                id="clientError"
                class="error-message"
                style="display:none;"
                role="alert"
            ></div>

            <form
                action="{{ url_for('forgot_password') }}"
                method="POST"
                id="forgotForm"
            >

                <div class="form-group">
                    <label for="email">
                        Registered Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- New Password -->
<div class="form-group">
    <label for="new_password">New Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="new_password"
            name="new_password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <i
            class="fas fa-eye-slash toggle-password"
            onclick="togglePassword('new_password', this)"
        ></i>
    </div>
</div>
<!-- Confirm Password -->
<div class="form-group">
    <label for="confirm_password">Confirm Password</label>

    <div class="password-wrapper">
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <i
            class="fas fa-eye-slash toggle-password"
            onclick="togglePassword('confirm_password', this)"
        ></i>
    </div>
</div>
       <div class="form-group">
                    <label for="captchaInput">
                        Security Verification <span class="required">*</span>
                    </label>

                    <div class="captcha-wrapper">
                        <canvas
                            id="captchaCanvas"
                            width="180"
                            height="48"
                        ></canvas>

                        <button
                            type="button"
                            class="refresh-btn"
                            id="refreshCaptcha"
                            title="Refresh CAPTCHA"
                            aria-label="Refresh CAPTCHA"
                        >
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>

                    <input
                        type="text"
                        id="captchaInput"
                        name="captchaInput"
                        placeholder="Enter verification code"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-lock"></i>
                    CHANGE PASSWORD
                    <a href="{{ url_for('login') }}"></a>

                </button>
                
            </form>


            <div class="back-link">
                Remembered your password?
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>

        </div>
    </div>


    <script>
        let captcha = "";


        function genCaptcha() {
            captcha = "";

            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            const canvas = document.getElementById("captchaCanvas");
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f0f6f8";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "bold 24px Arial";
            ctx.fillStyle = "#006f7c";

            for (let i = 0; i < 5; i++) {
                const ch = chars[
                    Math.floor(Math.random() * chars.length)
                ];

                captcha += ch;
                ctx.fillText(ch, 20 + i * 30, 33);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            genCaptcha();

            document.getElementById("refreshCaptcha")
                .addEventListener("click", function () {
                    genCaptcha();
                    document.getElementById("captchaInput").value = "";
                });

            const form = document.getElementById("forgotForm");
            const errorBox = document.getElementById("clientError");

            form.addEventListener("submit", function (event) {
                const enteredCaptcha = document
                    .getElementById("captchaInput")
                    .value.trim()
                    .toUpperCase();

                const password = document.getElementById("new_password").value;
                const confirmPassword =
                    document.getElementById("confirm_password").value;

                errorBox.style.display = "none";

                if (enteredCaptcha !== captcha) {
                    event.preventDefault();
                    errorBox.textContent =
                        "Incorrect CAPTCHA. Please try again.";
                    errorBox.style.display = "block";
                    genCaptcha();
                    document.getElementById("captchaInput").value = "";
                    return;
                }

                if (password !== confirmPassword) {
                    event.preventDefault();
                    errorBox.textContent = "Passwords do not match.";
                    errorBox.style.display = "block";
                    return;
                }
            });

            
        });
        function togglePassword(fieldId, icon) {
        const field = document.getElementById(fieldId);

    if (!field) return;

    if (field.type === "password") {
        field.type = "text";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    } else {
        field.type = "password";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }
}
    </script>

</body>
</html>
