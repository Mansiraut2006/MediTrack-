<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack - Forgot Password</title>

    <!-- Font Awesome for Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f8f9;
            color: #173b4d;
        }

        /* HEADER */
        .header {
            background: #006f7c;
            color: white;
            padding: 15px 40px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 8px;
            object-fit: contain;
            margin-right: 15px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 5px 0 0;
            font-size: 16px;
        }

        /* CONTAINER & BOX */
        .container {
            width: 100%;
            max-width: 550px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .forgot-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
        }

        .forgot-box h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 30px;
            color: #173b4d;
        }

        .subtitle {
            text-align: center;
            color: #6b7c85;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .required {
            color: red;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #007b8a;
            box-shadow: 0 0 0 2px rgba(0, 123, 138, 0.10);
        }

        /* CAPTCHA SECTION */
        .captcha-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        canvas {
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            background: #f0f6f8;
            height: 48px;
        }

        .refresh-btn {
            background: #f0f6f8;
            border: 1px solid #cbd8dd;
            border-radius: 10px;
            width: 48px;
            height: 48px;
            cursor: pointer;
            color: #006f7c;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh-btn:hover {
            background: #e1edf0;
        }

        /* MESSAGES */
        .error-message {
            background: #ffe7e7;
            color: #c62828;
            border: 1px solid #f2b5b5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-message {
            background: #e7f7ed;
            color: #18733a;
            border: 1px solid #b7e4c7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #006f7c;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #005864;
        }

        /* LINKS */
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .back-link a {
            color: #006f7c;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            .header {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .forgot-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <img
            src="{{ url_for('static', filename='images/meditrack_logo.png') }}"
            alt="MediTrack Logo"
            class="logo"
        >
        <div class="brand">
            <h1>MediTrack</h1>
            <p>Track Medicines. Improve Care.</p>
        </div>
    </header>

    <!-- FORGOT PASSWORD BOX -->
    <div class="container">
        <div class="forgot-box">
            <h2>Reset Password</h2>
            <p class="subtitle">Enter your registered email address and we'll send you instructions to reset your password.</p>

            <!-- SERVER MESSAGES -->
            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="success-message">
                    {{ success }}
                </div>
            {% endif %}

            <!-- CLIENT ERROR MESSAGE -->
            <div id="clientError" class="error-message" style="display: none;"></div>

            <form
                action="{{ url_for('forgot_password') }}"
                method="POST"
                id="forgotForm"
            >
                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">
                        Registered Email <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <!-- CAPTCHA -->
                <div class="form-group">
                    <label for="captchaInput">
                        Security Verification <span class="required">*</span>
                    </label>
                    <div class="captcha-wrapper">
                        <canvas id="captchaCanvas" width="180" height="48"></canvas>
                        <button 
                            type="button" 
                            class="refresh-btn" 
                            onclick="genCaptcha()" 
                            title="Refresh CAPTCHA"
                        >
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <input 
                        type="text" 
                        id="captchaInput" 
                        placeholder="Enter verification code" 
                        required 
                        autocomplete="off"
                    >
                </div>

                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Send Reset Link
                </button>
            </form>

            <!-- BACK TO LOGIN -->
            <div class="back-link">
                Remembered your password?
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        let captcha = "";

        // CAPTCHA Generator
        function genCaptcha() {
            captcha = "";
            let chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
            let canvas = document.getElementById("captchaCanvas");
            
            if (!canvas) return;
            let ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f0f6f8";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "bold 24px Arial";
            ctx.fillStyle = "#006f7c";

            for (let i = 0; i < 5; i++) {
                let ch = chars[Math.floor(Math.random() * chars.length)];
                captcha += ch;
                ctx.fillText(ch, 20 + i * 30, 33);
            }
        }

        window.addEventListener("DOMContentLoaded", genCaptcha);

        // Display Inline Error Box
        function showError(msg) {
            let errBox = document.getElementById("clientError");
            errBox.style.display = "block";
            errBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + msg;
            window.scrollTo({ top: errBox.offsetTop - 20, behavior: 'smooth' });
        }

        // Form Submit Validation
        document.getElementById("forgotForm").addEventListener("submit", function(event) {
            const userCaptcha = document.getElementById("captchaInput").value.trim();

            if (userCaptcha.toUpperCase() !== captcha.toUpperCase()) {
                event.preventDefault();
                showError("Incorrect Security Verification Code. Please try again.");
                genCaptcha();
                document.getElementById("captchaInput").value = "";
                return;
            }
        });
    </script>

</body>
</html>
